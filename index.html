<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vokabeln</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Times New Roman', serif;
            background: white;
            color: black;
            line-height: 1.6;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: normal;
        }
        
        .vocab-list {
            list-style: none;
        }
        
        .vocab-item {
            margin-bottom: 15px;
            padding: 10px;
            border-bottom: 1px solid black;
        }
        
        .latin {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 5px;
        }
        
        .german {
            font-size: 14px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <h1>Was willst du heute üben?</h1>
    
    <ul id="vocab-list" class="vocab-list"></ul>
    
    <script>
        async function loadLesson(lessonNumber) {
            try {
                const response = await fetch(`${lessonNumber}.json`);
                const vocabData = await response.json();
                
                const vocabList = document.getElementById('vocab-list');
                vocabList.innerHTML = '';
                
                vocabData.forEach(item => {
                    const li = document.createElement('li');
                    li.className = 'vocab-item';
                    li.innerHTML = `
                        <div class="latin">${item.latin}</div>
                        <div class="german">${item.german}</div>
                    `;
                    vocabList.appendChild(li);
                });
            } catch (error) {
                console.error('Fehler beim Laden der Vokabeln:', error);
                document.getElementById('vocab-list').innerHTML = '<li class="vocab-item">Fehler beim Laden der Vokabeln</li>';
            }
        }
        
        // Lektion 15 beim Start laden
        loadLesson('15');
    </script>
</body>
</html>
