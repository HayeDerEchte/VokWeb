<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vokabeln</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Times New Roman', serif;
            background: white;
            color: black;
            line-height: 1.6;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: normal;
        }
        
        .lesson-list, .vocab-list {
            list-style: none;
        }
        
        .lesson-item, .vocab-item {
            margin-bottom: 15px;
            padding: 10px;
            border-bottom: 1px solid black;
            cursor: pointer;
        }
        
        .lesson-item:hover, .vocab-item:hover {
            background: #f5f5f5;
        }
        
        .latin {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 5px;
        }
        
        .german {
            font-size: 14px;
            font-style: italic;
        }
        
        .flashcard-container {
            display: none;
            text-align: center;
            margin-top: 30px;
        }
        
        .flashcard {
            background: white;
            border: 2px solid black;
            padding: 40px;
            margin: 20px auto;
            max-width: 500px;
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            position: relative;
        }
        
        .flashcard.flipped {
            background: black;
            color: white;
        }
        
        .flashcard-controls {
            margin: 20px 0;
        }
        
        .btn {
            background: black;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 0 10px;
            cursor: pointer;
            font-family: inherit;
        }
        
        .btn:hover {
            background: #333;
        }
        
        .btn.correct {
            background: #2d5a2d;
        }
        
        .btn.correct:hover {
            background: #3a733a;
        }
        
        .btn.incorrect {
            background: #8b2d2d;
        }
        
        .btn.incorrect:hover {
            background: #a83333;
        }
        
        .progress {
            margin: 20px 0;
            font-size: 14px;
        }
        
        .results {
            display: none;
            text-align: center;
            margin: 30px 0;
        }
        
        .results h2 {
            margin-bottom: 20px;
        }
        
        .percentage {
            font-size: 48px;
            font-weight: bold;
            margin: 20px 0;
        }
        
        .wrong-answers {
            text-align: left;
            margin: 20px 0;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .wrong-item {
            margin-bottom: 15px;
            padding: 10px;
            border-bottom: 1px solid black;
        }
        
        .back-link {
            display: none;
            text-align: center;
            margin-bottom: 20px;
            text-decoration: none;
            color: black;
            font-style: italic;
        }
        
        .welcome-container {
            text-align: center;
            display: none;
        }
        
        .welcome-gif {
            margin: 20px 0;
        }
        
        .welcome-message {
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }
        
        .welcome-message.show {
            opacity: 1;
        }
        
        .fade-in {
            opacity: 0;
            animation: fadeIn 0.8s ease-in-out forwards;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .lesson-item {
            opacity: 0;
            animation: slideIn 0.5s ease-out forwards;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        .flashcard-container {
            opacity: 0;
            animation: fadeIn 0.6s ease-in-out 0.3s forwards;
        }
        
        .flashcard {
            opacity: 0;
            animation: cardAppear 0.8s ease-out 0.5s forwards;
            transform: scale(0.9);
        }
        
        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: scale(0.9) translateY(20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        
        .flashcard-controls {
            opacity: 0;
            animation: fadeIn 0.5s ease-in-out 0.7s forwards;
        }
        
        .progress {
            opacity: 0;
            animation: fadeIn 0.4s ease-in-out 0.2s forwards;
        }
        
        #card-content {
            opacity: 0;
            animation: textFadeIn 0.6s ease-out 0.8s forwards;
            transform: translateY(10px);
        }
        
        @keyframes textFadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .name-input {
            padding: 10px;
            border: 1px solid black;
            font-family: inherit;
            font-size: 16px;
            margin: 10px 0;
        }
        
        .name-submit {
            background: black;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-family: inherit;
            font-size: 16px;
        }
        
        .name-submit:hover {
            background: #333;
        }
        
        .settings-btn {
            position: fixed;
            bottom: 40px;
            right: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 20px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            background: transparent;
            border: none;
            color: black;
        }
        
        .settings-btn:hover {
            background: rgba(0,0,0,0.1);
        }
        
        .settings-menu {
            position: fixed;
            top: 0;
            right: -300px;
            width: 300px;
            height: 100vh;
            background: white;
            border-left: 1px solid black;
            padding: 20px;
            transition: right 0.3s ease-in-out;
            z-index: 1001;
            box-sizing: border-box;
        }
        
        .settings-menu.open {
            right: 0;
        }
        
        .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid black;
        }
        
        .settings-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: black;
        }
        
        .settings-close:hover {
            background: rgba(0,0,0,0.1);
        }
        
        .setting-item {
            margin-bottom: 20px;
        }
        
        .setting-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            padding: 10px 0;
        }
        
        .toggle-switch {
            position: relative;
            width: 50px;
            height: 24px;
            background: #ccc;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .toggle-switch.active {
            background: black;
        }
        
        .toggle-switch::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            transition: transform 0.3s;
        }
        
        .toggle-switch.active::after {
            transform: translateX(26px);
        }
        
        body.dark-mode {
            background: #1a1a1a;
            color: #ffffff;
        }
        
        body.dark-mode .flashcard {
            background: #2a2a2a;
            border-color: #ffffff;
            color: #ffffff;
        }
        
        body.dark-mode .flashcard.flipped {
            background: #ffffff;
            color: #1a1a1a;
        }
        
        body.dark-mode .btn {
            background: #ffffff;
            color: #1a1a1a;
        }
        
        body.dark-mode .btn:hover {
            background: #cccccc;
        }
        
        body.dark-mode .btn.correct {
            background: #4CAF50;
            color: white;
        }
        
        body.dark-mode .btn.correct:hover {
            background: #45a049;
        }
        
        body.dark-mode .btn.incorrect {
            background: #f44336;
            color: white;
        }
        
        body.dark-mode .btn.incorrect:hover {
            background: #da190b;
        }
        
        body.dark-mode .lesson-item,
        body.dark-mode .vocab-item,
        body.dark-mode .wrong-item {
            border-bottom-color: #ffffff;
        }
        
        body.dark-mode .lesson-item:hover,
        body.dark-mode .vocab-item:hover {
            background: #333333;
        }
        
        body.dark-mode .settings-menu {
            background: #2a2a2a;
            border-left-color: #ffffff;
        }
        
        body.dark-mode .settings-close {
            color: #ffffff;
        }
        
        body.dark-mode .settings-close:hover {
            background: rgba(255,255,255,0.1);
        }
        
        body.dark-mode .toggle-switch {
            background: #666;
        }
        
        body.dark-mode .toggle-switch.active {
            background: #ffffff;
        }
        
        body.dark-mode .toggle-switch::after {
            background: #1a1a1a;
        }
        
        body.dark-mode .name-input {
            background: #2a2a2a;
            border-color: #ffffff;
            color: #ffffff;
        }
        
        body.dark-mode .back-link {
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div id="name-prompt" class="welcome-container">
        <h1>Wie heißt du?</h1>
        <input type="text" id="name-input" class="name-input" placeholder="Dein Name" autofocus>
        <button class="name-submit" onclick="saveName()">Start</button>
    </div>
    
    <div id="main-content" style="display: none;">
        <a href="#" class="back-link" onclick="showLessonList()">← Zurück zur Übersicht</a>
        <h1 id="main-title">Was willst du heute üben?</h1>
        
        <ul id="lesson-list" class="lesson-list"></ul>
        
        <div id="flashcard-container" class="flashcard-container">
            <div class="progress">
                <span id="current-card">1</span> / <span id="total-cards">1</span>
            </div>
            
            <div id="flashcard" class="flashcard" onclick="flipCard()">
                <div id="card-content"></div>
            </div>
            
            <div class="flashcard-controls">
                <button class="btn incorrect" onclick="markIncorrect()">Falsch</button>
                <button class="btn correct" onclick="markCorrect()">Richtig</button>
            </div>
        </div>
        
        <div id="results" class="results">
            <h2>Ergebnisse</h2>
            <div class="percentage" id="percentage">0%</div>
            <div id="correct-count">0 von 0 richtig</div>
            <div class="wrong-answers" id="wrong-answers"></div>
            <button class="btn" onclick="restartQuiz()">Neustart</button>
        </div>
    </div>
    
    <!-- Settings Menu -->
    <div id="settings-menu" class="settings-menu">
        <div class="settings-header">
            <h2>Einstellungen</h2>
            <button class="settings-close" onclick="closeSettings()">×</button>
        </div>
        
        <div class="setting-item">
            <div class="setting-label" onclick="toggleDarkMode()">
                <span>Dunkelmodus</span>
                <div id="dark-mode-toggle" class="toggle-switch"></div>
            </div>
        </div>
    </div>
    
    <script>
        const lessons = [
            { number: 15, title: "Lektion 15" },
            { number: 16, title: "Lektion 16" }
        ];
        
        let currentLesson = null;
        let currentVocabData = [];
        let currentCardIndex = 0;
        let isFlipped = false;
        let correctAnswers = 0;
        let wrongAnswers = [];
        let answeredCards = new Set();
        let userName = localStorage.getItem('userName') || null;
        let darkMode = localStorage.getItem('darkMode') === 'true';
        
        // Initialize dark mode on page load
        if (darkMode) {
            document.body.classList.add('dark-mode');
            const darkModeToggle = document.getElementById('dark-mode-toggle');
            if (darkModeToggle) {
                darkModeToggle.classList.add('active');
            }
        }
        
        async function detectLessonFiles() {
            const detectedLessons = [];
            
            // Check for JSON files from 1 to 50
            for (let i = 1; i <= 50; i++) {
                try {
                    const response = await fetch(`${i}.json`);
                    if (response.ok) {
                        detectedLessons.push({
                            number: i,
                            title: `Lektion ${i}`
                        });
                    }
                } catch (error) {
                    // File doesn't exist, continue
                }
            }
            
            return detectedLessons;
        }
        
        function checkUserName() {
            if (userName) {
                showMainContent();
            } else {
                showNamePrompt();
            }
        }
        
        function showNamePrompt() {
            document.getElementById('name-prompt').style.display = 'block';
            document.getElementById('main-content').style.display = 'none';
        }
        
        async function showMainContent() {
            document.getElementById('name-prompt').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
            
            if (userName) {
                document.getElementById('main-title').innerHTML = `
                    <div class="welcome-message" id="welcome-message">
                        Hallo ${userName}<br>
                        <img src="https://media.tenor.com/VsiLDRUVTcYAAAAi/aga-wave.gif" alt="Wave" class="welcome-gif">
                    </div>
                `;
                
                // Fade in welcome message
                setTimeout(() => {
                    document.getElementById('welcome-message').classList.add('show');
                }, 100);
                
                // After 3 seconds, transition to lesson selection
                setTimeout(() => {
                    document.getElementById('welcome-message').classList.remove('show');
                    setTimeout(async () => {
                        await showLessonList();
                    }, 500);
                }, 3000);
            } else {
                await loadLessonList();
            }
        }
        
        async function saveName() {
            const nameInput = document.getElementById('name-input');
            const name = nameInput.value.trim();
            
            if (name) {
                userName = name;
                localStorage.setItem('userName', userName);
                await showMainContent();
            }
        }
        
        // Enter key support for name input
        document.addEventListener('DOMContentLoaded', function() {
            const nameInput = document.getElementById('name-input');
            if (nameInput) {
                nameInput.addEventListener('keypress', async function(e) {
                    if (e.key === 'Enter') {
                        await saveName();
                    }
                });
            }
        });
        
        async function showLessonList() {
            document.getElementById('main-title').innerHTML = 'Was willst du heute üben?';
            document.getElementById('main-title').classList.add('fade-in');
            document.getElementById('lesson-list').style.display = 'block';
            document.getElementById('flashcard-container').style.display = 'none';
            document.getElementById('results').style.display = 'none';
            document.querySelector('.back-link').style.display = 'none';
            await loadLessonList();
        }
        
        async function loadLessonList() {
            const lessonList = document.getElementById('lesson-list');
            lessonList.innerHTML = '';
            
            // Detect available lesson files
            const detectedLessons = await detectLessonFiles();
            
            // Use detected lessons or fallback to hardcoded lessons
            const lessonsToUse = detectedLessons.length > 0 ? detectedLessons : lessons;
            
            lessonsToUse.forEach((lesson, index) => {
                const li = document.createElement('li');
                li.className = 'lesson-item';
                li.style.animationDelay = `${index * 0.1}s`;
                li.innerHTML = `
                    <div class="latin">${lesson.title}</div>
                `;
                li.onclick = () => startFlashcards(lesson.number, lesson.title);
                lessonList.appendChild(li);
            });
            
            // Add settings button after lessons are loaded
            const settingsBtn = document.createElement('button');
            settingsBtn.className = 'btn settings-btn';
            settingsBtn.textContent = '⚙';
            settingsBtn.onclick = openSettings;
            lessonList.appendChild(settingsBtn);
            
            // Apply dark mode to settings button if needed
            if (darkMode) {
                settingsBtn.style.color = '#ffffff';
            }
        }
        
        async function startFlashcards(lessonNumber, lessonTitle) {
            try {
                console.log('Loading vocab from:', `${lessonNumber}.json`);
                
                let vocabData;
                
                // Try to fetch from JSON file
                try {
                    const response = await fetch(`${lessonNumber}.json`);
                    console.log('Response status:', response.status);
                    
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }
                    
                    vocabData = await response.json();
                    console.log('Loaded vocab data:', vocabData);
                } catch (fetchError) {
                    console.log('Fetch failed, using embedded data:', fetchError.message);
                    
                    // Fallback to embedded data for local testing
                    vocabData = [
                        {
                            "latin": "vester, vestra, vestrum",
                            "german": "euer"
                        },
                        {
                            "latin": "noster, nostra, nostrum",
                            "german": "unser"
                        },
                        {
                            "latin": "gravis, gravis, grave",
                            "german": "schwer; wichtig; ernst"
                        },
                        {
                            "latin": "tuus, tua, tuum",
                            "german": "dein"
                        },
                        {
                            "latin": "pro (m. Abl.)",
                            "german": "vor; für; anstelle (von)"
                        },
                        {
                            "latin": "se (Akk.) / sibi (Dat.) / secum (Abl.)",
                            "german": "sich / sich / mit sich, bei sich"
                        },
                        {
                            "latin": "facilis, facilis, facile",
                            "german": "leicht; umgänglich"
                        },
                        {
                            "latin": "se praebere, facile",
                            "german": "sich zeigen, sich erweisen als"
                        },
                        {
                            "latin": "acer, acris, acre",
                            "german": "heftig; hart; scharf"
                        },
                        {
                            "latin": "arcessere, arcessō, arcessīvī",
                            "german": "herbeirufen, holen"
                        }
                    ];
                }
                
                if (!Array.isArray(vocabData)) {
                    throw new Error('Vokabeln sind kein Array');
                }
                
                if (vocabData.length === 0) {
                    throw new Error('Keine Vokabeln gefunden');
                }
                
                currentVocabData = vocabData;
                currentLesson = lessonNumber;
                currentCardIndex = 0;
                isFlipped = false;
                correctAnswers = 0;
                wrongAnswers = [];
                answeredCards.clear();
                
                // Shuffle cards
                currentVocabData = [...currentVocabData].sort(() => Math.random() - 0.5);
                console.log('Shuffled vocab:', currentVocabData);
                
                document.getElementById('main-title').textContent = lessonTitle;
                document.getElementById('lesson-list').style.display = 'none';
                document.getElementById('flashcard-container').style.display = 'block';
                document.getElementById('results').style.display = 'none';
                document.querySelector('.back-link').style.display = 'block';
                document.getElementById('total-cards').textContent = currentVocabData.length;
                
                // Reset and trigger animations
                const flashcardContainer = document.getElementById('flashcard-container');
                const flashcard = document.getElementById('flashcard');
                const flashcardControls = document.querySelector('.flashcard-controls');
                const progress = document.querySelector('.progress');
                
                // Remove animation classes
                flashcardContainer.style.animation = 'none';
                flashcard.style.animation = 'none';
                flashcardControls.style.animation = 'none';
                progress.style.animation = 'none';
                
                // Force reflow
                void flashcardContainer.offsetWidth;
                
                // Re-add animations
                flashcardContainer.style.animation = 'fadeIn 0.6s ease-in-out 0.3s forwards';
                flashcard.style.animation = 'cardAppear 0.8s ease-out 0.5s forwards';
                flashcardControls.style.animation = 'fadeIn 0.5s ease-in-out 0.7s forwards';
                progress.style.animation = 'fadeIn 0.4s ease-in-out 0.2s forwards';
                
                showCard();
            } catch (error) {
                console.error('Fehler beim Laden der Vokabeln:', error);
                alert('Fehler beim Laden: ' + error.message);
                showLessonList();
            }
        }
        
        function showCard() {
            console.log('showCard called, currentCardIndex:', currentCardIndex, 'vocabData length:', currentVocabData?.length);
            
            if (!currentVocabData || currentVocabData.length === 0 || currentCardIndex >= currentVocabData.length) {
                console.error('Keine Vokabeln verfügbar');
                return;
            }
            
            const card = document.getElementById('flashcard');
            const content = document.getElementById('card-content');
            const vocab = currentVocabData[currentCardIndex];
            
            console.log('Current vocab:', vocab);
            
            if (!vocab || !vocab.latin || !vocab.german) {
                console.error('Ungültige Vokabel:', vocab);
                return;
            }
            
            card.classList.remove('flipped');
            isFlipped = false;
            
            // Reset text animation
            content.style.animation = 'none';
            content.style.opacity = '0';
            content.style.transform = 'translateY(10px)';
            
            // Force reflow
            void content.offsetWidth;
            
            // Set content and trigger animation
            content.textContent = vocab.latin;
            content.style.animation = 'textFadeIn 0.6s ease-out forwards';
            
            document.getElementById('current-card').textContent = currentCardIndex + 1;
        }
        
        function flipCard() {
            if (!currentVocabData || currentVocabData.length === 0 || currentCardIndex >= currentVocabData.length) {
                console.error('Keine Vokabeln verfügbar');
                return;
            }
            
            const card = document.getElementById('flashcard');
            const content = document.getElementById('card-content');
            const vocab = currentVocabData[currentCardIndex];
            
            if (!vocab || !vocab.latin || !vocab.german) {
                console.error('Ungültige Vokabel:', vocab);
                return;
            }
            
            if (isFlipped) {
                card.classList.remove('flipped');
                content.textContent = vocab.latin;
            } else {
                card.classList.add('flipped');
                content.textContent = vocab.german;
            }
            isFlipped = !isFlipped;
        }
        
        function markCorrect() {
            if (!answeredCards.has(currentCardIndex)) {
                correctAnswers++;
                answeredCards.add(currentCardIndex);
            }
            nextCard();
        }
        
        function markIncorrect() {
            if (!answeredCards.has(currentCardIndex)) {
                wrongAnswers.push(currentVocabData[currentCardIndex]);
                answeredCards.add(currentCardIndex);
            }
            nextCard();
        }
        
        function nextCard() {
            if (currentCardIndex < currentVocabData.length - 1) {
                currentCardIndex++;
                showCard();
            } else {
                showResults();
            }
        }
        
        function showResults() {
            const total = currentVocabData.length;
            const percentage = Math.round((correctAnswers / total) * 100);
            
            document.getElementById('flashcard-container').style.display = 'none';
            document.getElementById('results').style.display = 'block';
            document.getElementById('percentage').textContent = percentage + '%';
            document.getElementById('correct-count').textContent = `${correctAnswers} von ${total} richtig`;
            
            const wrongAnswersDiv = document.getElementById('wrong-answers');
            wrongAnswersDiv.innerHTML = '';
            
            if (wrongAnswers.length > 0) {
                wrongAnswersDiv.innerHTML = '<h3>Falsche Antworten:</h3>';
                wrongAnswers.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'wrong-item';
                    div.innerHTML = `
                        <div class="latin">${item.latin}</div>
                        <div class="german">${item.german}</div>
                    `;
                    wrongAnswersDiv.appendChild(div);
                });
            }
            
            const resultsDiv = document.getElementById('results');
            const existingButton = document.getElementById('practice-wrong-btn');
            if (existingButton) {
                existingButton.remove();
            }
            
            if (wrongAnswers.length > 0) {
                const practiceWrongBtn = document.createElement('button');
                practiceWrongBtn.id = 'practice-wrong-btn';
                practiceWrongBtn.className = 'btn';
                practiceWrongBtn.textContent = 'Falsche Vokabeln üben';
                practiceWrongBtn.onclick = practiceWrongAnswers;
                practiceWrongBtn.style.marginLeft = '10px';
                
                const restartBtn = resultsDiv.querySelector('button');
                restartBtn.parentNode.insertBefore(practiceWrongBtn, restartBtn.nextSibling);
            }
        }
        
        function restartQuiz() {
            startFlashcards(currentLesson, document.getElementById('main-title').textContent);
        }
        
        function practiceWrongAnswers() {
            if (wrongAnswers.length === 0) {
                alert('Keine falschen Antworten zum Üben vorhanden.');
                return;
            }
            
            currentVocabData = [...wrongAnswers];
            currentCardIndex = 0;
            isFlipped = false;
            correctAnswers = 0;
            const previousWrongAnswers = [...wrongAnswers];
            wrongAnswers = [];
            answeredCards.clear();
            
            currentVocabData = currentVocabData.sort(() => Math.random() - 0.5);
            
            document.getElementById('main-title').textContent = 'Falsche Vokabeln üben';
            document.getElementById('results').style.display = 'none';
            document.getElementById('flashcard-container').style.display = 'block';
            document.getElementById('total-cards').textContent = currentVocabData.length;
            
            // Reset and trigger animations
            const flashcardContainer = document.getElementById('flashcard-container');
            const flashcard = document.getElementById('flashcard');
            const flashcardControls = document.querySelector('.flashcard-controls');
            const progress = document.querySelector('.progress');
            
            // Remove animation classes
            flashcardContainer.style.animation = 'none';
            flashcard.style.animation = 'none';
            flashcardControls.style.animation = 'none';
            progress.style.animation = 'none';
            
            // Force reflow
            void flashcardContainer.offsetWidth;
            
            // Re-add animations
            flashcardContainer.style.animation = 'fadeIn 0.6s ease-in-out 0.3s forwards';
            flashcard.style.animation = 'cardAppear 0.8s ease-out 0.5s forwards';
            flashcardControls.style.animation = 'fadeIn 0.5s ease-in-out 0.7s forwards';
            progress.style.animation = 'fadeIn 0.4s ease-in-out 0.2s forwards';
            
            showCard();
        }
        
        function openSettings() {
            document.getElementById('settings-menu').classList.add('open');
        }
        
        function closeSettings() {
            document.getElementById('settings-menu').classList.remove('open');
        }
        
        function toggleDarkMode() {
            darkMode = !darkMode;
            const darkModeToggle = document.getElementById('dark-mode-toggle');
            
            if (darkMode) {
                document.body.classList.add('dark-mode');
                darkModeToggle.classList.add('active');
            } else {
                document.body.classList.remove('dark-mode');
                darkModeToggle.classList.remove('active');
            }
            
            localStorage.setItem('darkMode', darkMode);
        }
        
        checkUserName();
    </script>
</body>
</html>
