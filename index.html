<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vokabeln</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Times New Roman', serif;
            background: white;
            color: black;
            line-height: 1.6;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: normal;
        }
        
        .lesson-list, .vocab-list {
            list-style: none;
        }
        
        .lesson-item, .vocab-item {
            margin-bottom: 15px;
            padding: 10px;
            border-bottom: 1px solid black;
            cursor: pointer;
        }
        
        .lesson-item:hover, .vocab-item:hover {
            background: #f5f5f5;
        }
        
        .latin {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 5px;
        }
        
        .german {
            font-size: 14px;
            font-style: italic;
        }
        
        .flashcard-container {
            display: none;
            text-align: center;
            margin-top: 30px;
        }
        
        .flashcard {
            background: white;
            border: 2px solid black;
            padding: 40px;
            margin: 20px auto;
            max-width: 500px;
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            position: relative;
        }
        
        .flashcard.flipped {
            background: black;
            color: white;
        }
        
        .flashcard-controls {
            margin: 20px 0;
        }
        
        .btn {
            background: black;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 0 10px;
            cursor: pointer;
            font-family: inherit;
        }
        
        .btn:hover {
            background: #333;
        }
        
        .btn.correct {
            background: #2d5a2d;
        }
        
        .btn.correct:hover {
            background: #3a733a;
        }
        
        .btn.incorrect {
            background: #8b2d2d;
        }
        
        .btn.incorrect:hover {
            background: #a83333;
        }
        
        .progress {
            margin: 20px 0;
            font-size: 14px;
        }
        
        .results {
            display: none;
            text-align: center;
            margin: 30px 0;
        }
        
        .results h2 {
            margin-bottom: 20px;
        }
        
        .percentage {
            font-size: 48px;
            font-weight: bold;
            margin: 20px 0;
        }
        
        .wrong-answers {
            text-align: left;
            margin: 20px 0;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .wrong-item {
            margin-bottom: 15px;
            padding: 10px;
            border-bottom: 1px solid black;
        }
        
        .back-link {
            display: none;
            text-align: center;
            margin-bottom: 20px;
            text-decoration: none;
            color: black;
            font-style: italic;
        }
        
        .welcome-container {
            display: none;
            text-align: center;
            margin: 50px 0;
        }
        
        .welcome-container input {
            padding: 10px;
            border: 1px solid black;
            background: white;
            font-family: inherit;
            font-size: 16px;
            margin: 10px;
        }
        
        .welcome-container button {
            padding: 10px 20px;
            background: black;
            color: white;
            border: none;
            font-family: inherit;
            cursor: pointer;
            margin: 10px;
        }
        
        .welcome-container button:hover {
            background: #333;
        }
        
        .greeting {
            display: none;
            text-align: center;
            margin: 30px 0;
        }
        
        .greeting h2 {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <a href="#" class="back-link" onclick="showLessonList()">← Zurück zur Übersicht</a>
    
    <div id="welcome-container" class="welcome-container">
        <h2>Wie heißt du?</h2>
        <input type="text" id="name-input" placeholder="Dein Name" onkeypress="if(event.key === 'Enter') saveName()">
        <button onclick="saveName()">Los geht's!</button>
    </div>
    
    <div id="greeting" class="greeting">
        <h2 id="greeting-text">Hallo!</h2>
        <div class="tenor-gif-embed" data-postid="6253400970908487110" data-share-method="host" data-aspect-ratio="1.56028" data-width="100%">
            <a href="https://tenor.com/view/aga-wave-hi-hello-yellow-gif-6253400970908487110">Aga Wave Sticker</a>from <a href="https://tenor.com/search/aga-stickers">Aga Stickers</a>
        </div>
        <script type="text/javascript" async src="https://tenor.com/embed.js"></script>
        <button onclick="showLessonList()" style="margin-top: 20px;">Weiter zum Lernen</button>
    </div>
    
    <h1 id="main-title" style="display: none;">Was willst du heute üben?</h1>
    
    <ul id="lesson-list" class="lesson-list" style="display: none;"></ul>
    
    <div id="flashcard-container" class="flashcard-container">
        <div class="progress">
            <span id="current-card">1</span> / <span id="total-cards">1</span>
        </div>
        
        <div id="flashcard" class="flashcard" onclick="flipCard()">
            <div id="card-content"></div>
        </div>
        
        <div class="flashcard-controls">
            <button class="btn incorrect" onclick="markIncorrect()">Falsch</button>
            <button class="btn correct" onclick="markCorrect()">Richtig</button>
        </div>
    </div>
    
    <div id="results" class="results">
        <h2>Ergebnisse</h2>
        <div class="percentage" id="percentage">0%</div>
        <div id="correct-count">0 von 0 richtig</div>
        <div class="wrong-answers" id="wrong-answers"></div>
        <button class="btn" onclick="restartQuiz()">Neustart</button>
    </div>
    
    <script>
        const lessons = [
            { number: 15, title: "Lektion 15" }
        ];
        
        let currentLesson = null;
        let currentVocabData = [];
        let currentCardIndex = 0;
        let isFlipped = false;
        let correctAnswers = 0;
        let wrongAnswers = [];
        let answeredCards = new Set();
        let userName = localStorage.getItem('userName') || null;
        
        function checkFirstVisit() {
            if (userName) {
                showGreeting();
            } else {
                showWelcome();
            }
        }
        
        function showWelcome() {
            document.getElementById('welcome-container').style.display = 'block';
            document.getElementById('greeting').style.display = 'none';
            document.getElementById('main-title').style.display = 'none';
            document.getElementById('lesson-list').style.display = 'none';
            document.querySelector('.back-link').style.display = 'none';
            document.getElementById('flashcard-container').style.display = 'none';
            document.getElementById('results').style.display = 'none';
        }
        
        function showGreeting() {
            document.getElementById('welcome-container').style.display = 'none';
            document.getElementById('greeting').style.display = 'block';
            document.getElementById('main-title').style.display = 'none';
            document.getElementById('lesson-list').style.display = 'none';
            document.querySelector('.back-link').style.display = 'none';
            document.getElementById('flashcard-container').style.display = 'none';
            document.getElementById('results').style.display = 'none';
            document.getElementById('greeting-text').textContent = `Hallo ${userName}!`;
        }
        
        function saveName() {
            const nameInput = document.getElementById('name-input');
            const name = nameInput.value.trim();
            if (name) {
                userName = name;
                localStorage.setItem('userName', name);
                showGreeting();
            }
        }
        
        function showLessonList() {
            document.getElementById('welcome-container').style.display = 'none';
            document.getElementById('greeting').style.display = 'none';
            document.getElementById('main-title').style.display = 'block';
            document.getElementById('lesson-list').style.display = 'block';
            document.getElementById('flashcard-container').style.display = 'none';
            document.getElementById('results').style.display = 'none';
            document.querySelector('.back-link').style.display = 'none';
        }
        
        function loadLessonList() {
            const lessonList = document.getElementById('lesson-list');
            lessonList.innerHTML = '';
            
            lessons.forEach(lesson => {
                const li = document.createElement('li');
                li.className = 'lesson-item';
                li.innerHTML = `
                    <div class="latin">${lesson.title}</div>
                `;
                li.onclick = () => startFlashcards(lesson.number, lesson.title);
                lessonList.appendChild(li);
            });
        }
        
        async function startFlashcards(lessonNumber, lessonTitle) {
            try {
                const response = await fetch(`${lessonNumber}.json`);
                currentVocabData = await response.json();
                currentLesson = lessonNumber;
                currentCardIndex = 0;
                isFlipped = false;
                correctAnswers = 0;
                wrongAnswers = [];
                answeredCards.clear();
                
                // Shuffle cards
                currentVocabData = currentVocabData.sort(() => Math.random() - 0.5);
                
                document.getElementById('main-title').textContent = lessonTitle;
                document.getElementById('lesson-list').style.display = 'none';
                document.getElementById('flashcard-container').style.display = 'block';
                document.getElementById('results').style.display = 'none';
                document.querySelector('.back-link').style.display = 'block';
                document.getElementById('total-cards').textContent = currentVocabData.length;
                
                showCard();
            } catch (error) {
                console.error('Fehler beim Laden der Vokabeln:', error);
            }
        }
        
        function showCard() {
            const card = document.getElementById('flashcard');
            const content = document.getElementById('card-content');
            const vocab = currentVocabData[currentCardIndex];
            
            card.classList.remove('flipped');
            isFlipped = false;
            content.textContent = vocab.latin;
            document.getElementById('current-card').textContent = currentCardIndex + 1;
        }
        
        function flipCard() {
            const card = document.getElementById('flashcard');
            const content = document.getElementById('card-content');
            const vocab = currentVocabData[currentCardIndex];
            
            if (isFlipped) {
                card.classList.remove('flipped');
                content.textContent = vocab.latin;
            } else {
                card.classList.add('flipped');
                content.textContent = vocab.german;
            }
            isFlipped = !isFlipped;
        }
        
        function markCorrect() {
            if (!answeredCards.has(currentCardIndex)) {
                correctAnswers++;
                answeredCards.add(currentCardIndex);
            }
            nextCard();
        }
        
        function markIncorrect() {
            if (!answeredCards.has(currentCardIndex)) {
                wrongAnswers.push(currentVocabData[currentCardIndex]);
                answeredCards.add(currentCardIndex);
            }
            nextCard();
        }
        
        function nextCard() {
            if (currentCardIndex < currentVocabData.length - 1) {
                currentCardIndex++;
                showCard();
            } else {
                showResults();
            }
        }
        
        function showResults() {
            const total = currentVocabData.length;
            const percentage = Math.round((correctAnswers / total) * 100);
            
            document.getElementById('flashcard-container').style.display = 'none';
            document.getElementById('results').style.display = 'block';
            document.getElementById('percentage').textContent = percentage + '%';
            document.getElementById('correct-count').textContent = `${correctAnswers} von ${total} richtig`;
            
            const wrongAnswersDiv = document.getElementById('wrong-answers');
            wrongAnswersDiv.innerHTML = '';
            
            if (wrongAnswers.length > 0) {
                wrongAnswersDiv.innerHTML = '<h3>Falsche Antworten:</h3>';
                wrongAnswers.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'wrong-item';
                    div.innerHTML = `
                        <div class="latin">${item.latin}</div>
                        <div class="german">${item.german}</div>
                    `;
                    wrongAnswersDiv.appendChild(div);
                });
            }
        }
        
        function restartQuiz() {
            startFlashcards(currentLesson, document.getElementById('main-title').textContent);
        }
        
        // Lektionen beim Start laden
        checkFirstVisit();
    </script>
</body>
</html>
