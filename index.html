<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vokabeln</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Times New Roman', serif;
            background: white;
            color: black;
            line-height: 1.6;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: normal;
        }
        
        .lesson-list, .vocab-list {
            list-style: none;
        }
        
        .lesson-item, .vocab-item {
            margin-bottom: 15px;
            padding: 10px;
            border-bottom: 1px solid black;
            cursor: pointer;
        }
        
        .lesson-item:hover, .vocab-item:hover {
            background: #f5f5f5;
        }
        
        .latin {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 5px;
        }
        
        .german {
            font-size: 14px;
            font-style: italic;
        }
        
        .flashcard-container {
            display: none;
            text-align: center;
            margin-top: 30px;
        }
        
        .flashcard {
            background: white;
            border: 2px solid black;
            padding: 40px;
            margin: 20px auto;
            max-width: 500px;
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            position: relative;
        }
        
        .flashcard.flipped {
            background: black;
            color: white;
        }
        
        .flashcard-controls {
            margin: 20px 0;
        }
        
        .btn {
            background: black;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 0 10px;
            cursor: pointer;
            font-family: inherit;
        }
        
        .btn:hover {
            background: #333;
        }
        
        .progress {
            margin: 20px 0;
            font-size: 14px;
        }
        
        .back-link {
            display: none;
            text-align: center;
            margin-bottom: 20px;
            text-decoration: none;
            color: black;
            font-style: italic;
        }
    </style>
</head>
<body>
    <a href="#" class="back-link" onclick="showLessonList()">← Zurück zur Übersicht</a>
    <h1 id="main-title">Was willst du heute üben?</h1>
    
    <ul id="lesson-list" class="lesson-list"></ul>
    
    <div id="flashcard-container" class="flashcard-container">
        <div class="progress">
            <span id="current-card">1</span> / <span id="total-cards">1</span>
        </div>
        
        <div id="flashcard" class="flashcard" onclick="flipCard()">
            <div id="card-content"></div>
        </div>
        
        <div class="flashcard-controls">
            <button class="btn" onclick="previousCard()">← Vorherige</button>
            <button class="btn" onclick="nextCard()">Nächste →</button>
        </div>
    </div>
    
    <script>
        const lessons = [
            { number: 15, title: "Lektion 15" }
        ];
        
        let currentLesson = null;
        let currentVocabData = [];
        let currentCardIndex = 0;
        let isFlipped = false;
        
        function showLessonList() {
            document.getElementById('main-title').textContent = 'Was willst du heute üben?';
            document.getElementById('lesson-list').style.display = 'block';
            document.getElementById('flashcard-container').style.display = 'none';
            document.querySelector('.back-link').style.display = 'none';
        }
        
        function loadLessonList() {
            const lessonList = document.getElementById('lesson-list');
            lessonList.innerHTML = '';
            
            lessons.forEach(lesson => {
                const li = document.createElement('li');
                li.className = 'lesson-item';
                li.innerHTML = `
                    <div class="latin">${lesson.title}</div>
                    <div class="german">Klicke hier um zu starten</div>
                `;
                li.onclick = () => startFlashcards(lesson.number, lesson.title);
                lessonList.appendChild(li);
            });
        }
        
        async function startFlashcards(lessonNumber, lessonTitle) {
            try {
                const response = await fetch(`${lessonNumber}.json`);
                currentVocabData = await response.json();
                currentLesson = lessonNumber;
                currentCardIndex = 0;
                isFlipped = false;
                
                document.getElementById('main-title').textContent = lessonTitle;
                document.getElementById('lesson-list').style.display = 'none';
                document.getElementById('flashcard-container').style.display = 'block';
                document.querySelector('.back-link').style.display = 'block';
                document.getElementById('total-cards').textContent = currentVocabData.length;
                
                showCard();
            } catch (error) {
                console.error('Fehler beim Laden der Vokabeln:', error);
            }
        }
        
        function showCard() {
            const card = document.getElementById('flashcard');
            const content = document.getElementById('card-content');
            const vocab = currentVocabData[currentCardIndex];
            
            card.classList.remove('flipped');
            isFlipped = false;
            content.textContent = vocab.latin;
            document.getElementById('current-card').textContent = currentCardIndex + 1;
        }
        
        function flipCard() {
            const card = document.getElementById('flashcard');
            const content = document.getElementById('card-content');
            const vocab = currentVocabData[currentCardIndex];
            
            if (isFlipped) {
                card.classList.remove('flipped');
                content.textContent = vocab.latin;
            } else {
                card.classList.add('flipped');
                content.textContent = vocab.german;
            }
            isFlipped = !isFlipped;
        }
        
        function nextCard() {
            currentCardIndex = (currentCardIndex + 1) % currentVocabData.length;
            showCard();
        }
        
        function previousCard() {
            currentCardIndex = (currentCardIndex - 1 + currentVocabData.length) % currentVocabData.length;
            showCard();
        }
        
        // Lektionen beim Start laden
        loadLessonList();
    </script>
</body>
</html>
